# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - dattoBcdrPublicKey
      - dattoBcdrPrivateKey
    properties:
      dattoBcdrPublicKey:
        type: string
        description: Your Datto BCDR partner portal public API key
      dattoBcdrPrivateKey:
        type: string
        description: Your Datto BCDR partner portal private API key
      dattoBcdrRegion:
        type: string
        description: "Region: 'us' (default) or 'eu'"
  commandFunction: |-
    (config) => ({ command: 'node', args: ['dist/index.js'], env: { DATTO_BCDR_PUBLIC_KEY: config.dattoBcdrPublicKey, DATTO_BCDR_PRIVATE_KEY: config.dattoBcdrPrivateKey, DATTO_BCDR_REGION: config.dattoBcdrRegion, MCP_TRANSPORT: 'stdio' } })
